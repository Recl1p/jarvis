# JARVIS on TrueNAS -- the live stack (managed in Dockge as "jarvis"). JARVIS 2: Hermes is not in the image.
#
#   Source:   ./src  (this repo; ./src/Dockerfile builds localhost/jarvis:local)
#   Data:     /mnt/SSDCACHE256/jarvis/data -> /opt/data: Hermes (installed there by JARVIS from Nous Research's official
#             installer, after consent on the setup screen) and its home: config, logins, memory, skills, chats, cron
#             jobs, notes, music, the browser profile; JARVIS's own state in data/jarvis. Snapshot the
#             SSDCACHE256/jarvis dataset for backups.
#   Files:    /mnt/SSDCACHE256/jarvis/files/{Documents,Downloads}, at the paths JARVIS used on the old PC.
#   Access:   home LAN, plain http. JARVIS 2.1 asks for a password (created on the first visit after updating):
#               http://truenas.local:8642          setup screen + connection test: /jarvis/   dashboard: /vesper
#               browser desktop: /desktop/ (behind the same login)
#             Anywhere, via the NAS Tailscale app (HTTPS, needed for the mic on phones):
#               https://truenas-scale.anchovy-chameleon.ts.net/vesper   (and /desktop/)
#               https://truenas-scale.anchovy-chameleon.ts.net:6080/vnc.html  (the old desktop address: NO login;
#               drop the 6080 port below and JARVIS_DESKTOP_LISTEN to close it once /desktop/ is in use)
#   Update:   JARVIS itself: change ./src, then `sudo sh update.sh` (rebuild, health check, automatic rollback).
#             Hermes: automatic, daily at 04:00, from the setup screen's Updates card (with its own rollback).
#             Dockge's "Update" button only pulls images and won't rebuild this local one.
#   CLI:      sudo docker exec -it --user hermes jarvis hermes model   (keep --user hermes)
# Defaults are the live NAS; a .env next to this file can override them (cutover rehearsals do).
name: ${JARVIS_STACK_NAME:-jarvis}
x-dockge:
  urls:
    - http://truenas.local:8642/vesper
    - http://truenas.local:8642/jarvis/
    - https://truenas-scale.anchovy-chameleon.ts.net/vesper
    - https://truenas-scale.anchovy-chameleon.ts.net:6080/vnc.html?autoconnect=true&resize=remote
services:
  jarvis:
    image: ${JARVIS_IMAGE:-localhost/jarvis:local}
    pull_policy: never # local build only -- nothing to pull
    build:
      # update.sh builds from a copy staged on tmpfs (JARVIS_BUILD_CONTEXT) so files keep the repo's own modes.
      context: ${JARVIS_BUILD_CONTEXT:-./src}
      args:
        JARVIS_LOCAL_VOICES: "1"
    container_name: ${JARVIS_CONTAINER:-jarvis}
    ports:
      # Setup screen + dashboard: all interfaces (LAN + Tailscale).
      - ${JARVIS_PORT:-8642}:8642
      # Browser desktop: LAN IP only. The Tailscale app's HTTPS publish already holds :6080 on the Tailscale IP and
      # proxies to http://10.0.0.103:6080. 10.0.0.103 MUST stay this NAS's address (DHCP reservation).
      - ${JARVIS_DESKTOP_BIND:-10.0.0.103}:${JARVIS_DESKTOP_PORT:-6080}:6080
    environment:
      TZ: America/New_York
      JARVIS_SCAN_SUBNETS: 10.0.0.0/24
      # Keeps the published :6080 desktop (the Tailscale :6080 address) working; noVNC is loopback-only otherwise.
      JARVIS_DESKTOP_LISTEN: 0.0.0.0
    volumes:
      - ${JARVIS_DATA_ROOT:-/mnt/SSDCACHE256/jarvis}/data:/opt/data
      - ${JARVIS_DATA_ROOT:-/mnt/SSDCACHE256/jarvis}/files/Documents:/var/home/akhdaier/Documents
      - ${JARVIS_DATA_ROOT:-/mnt/SSDCACHE256/jarvis}/files/Downloads:/var/home/akhdaier/Downloads
      - ${JARVIS_DATA_ROOT:-/mnt/SSDCACHE256/jarvis}/files/Documents:/home/akhdaier/Documents
      - ${JARVIS_DATA_ROOT:-/mnt/SSDCACHE256/jarvis}/files/Downloads:/home/akhdaier/Downloads
    labels:
      # Watchtower updates every container nightly; this image is built locally, never pulled. JARVIS updates Hermes.
      com.centurylinklabs.watchtower.enable: "false"
    shm_size: 1gb
    stop_grace_period: 90s
    restart: unless-stopped
networks: {}
