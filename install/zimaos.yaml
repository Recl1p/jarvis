# JARVIS for ZimaOS (and CasaOS).
# App Store -> the "+" button at the top right -> Install a customized app -> Import -> paste this whole file -> Submit,
# then Install. Open JARVIS from its tile (or http://<your Zima address>:8642) and create JARVIS's password.
# Full guide: INSTALL.md.
name: jarvis
services:
  jarvis:
    image: ghcr.io/recl1p/jarvis:2
    container_name: jarvis
    ports:
      # Setup screen, dashboard (/vesper) and browser desktop (/desktop/), all behind JARVIS's password.
      - "8642:8642"
    volumes:
      # Everything JARVIS and Hermes keep, in ZimaOS's usual app data folder (Docker creates it on the first start).
      - /DATA/AppData/jarvis/data:/opt/data
    environment:
      TZ: America/New_York            # your time zone (cron jobs and reminders run on it)
      # Unlocks the JARVIS, Ultron and Cortana voices built into the image. Leave it as you received it.
      JARVIS_VOICE_KEY: "@JARVIS_VOICE_KEY@"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Optional, for OmniVoice on an NVIDIA GPU (INSTALL.md, OmniVoice): the host needs NVIDIA's driver and container
    # toolkit. Uncomment, then install OmniVoice's GPU build from the setup screen.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    shm_size: 1gb
    stop_grace_period: 90s
    restart: unless-stopped
    x-casaos:
      ports:
        - container: "8642"
          description:
            en_us: Setup screen, dashboard and browser desktop
      volumes:
        - container: /opt/data
          description:
            en_us: Everything JARVIS and Hermes keep (settings, chats, memories, logins)
      envs:
        - container: TZ
          description:
            en_us: Your time zone
        - container: JARVIS_VOICE_KEY
          description:
            en_us: Unlocks the built-in JARVIS, Ultron and Cortana voices
x-casaos:
  architectures:
    - amd64
  main: jarvis
  author: Recl1p
  developer: Recl1p
  category: Utilities
  title:
    en_us: JARVIS
  tagline:
    en_us: A voice dashboard for Hermes Agent
  description:
    en_us: JARVIS is a dashboard, voice and browser desktop for Hermes Agent, Nous Research's open-source AI agent. On first start it installs Hermes for you (after you agree) or connects the Hermes you already have.
  index: /
  port_map: "8642"
  scheme: http
